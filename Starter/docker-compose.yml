# Third-party / AI boot stack (preferred over root docker-compose.yml).
# From repo root: docker compose -f Starter/docker-compose.yml up --build -d
# Or: Starter/up.ps1 | Starter/up.sh
#
# Container names match the live developer setup: Zunda-Yaboo + zunda-llm-gw.
# If those names already exist, stop them first (see Starter/README.md).

services:
  llm-gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: zunda-llm-gw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GW_LMSTUDIO_HOST: ${GW_LMSTUDIO_HOST:-host.docker.internal}
      GW_LMSTUDIO_PORT: ${GW_LMSTUDIO_PORT:-1234}
      GW_POLICY_MODEL: ${GW_POLICY_MODEL:-qwen3-4b-instruct-2507}
      GW_IDS_MODEL: ${GW_IDS_MODEL:-qwen2.5-7b-instruct}
      GW_PROSE_MODEL: ${GW_PROSE_MODEL:-qwen2.5-14b-instruct}
      GW_CRISIS_MODEL: ${GW_CRISIS_MODEL:-qwen3.6-27b}
      GW_CRISIS_USE_27B: ${GW_CRISIS_USE_27B:-1}
    ports:
      - "${GW_HOST_PORT:-4000}:4000"
    restart: unless-stopped

  zunda-yaboo:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: Zunda-Yaboo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - llm-gateway
    environment:
      PYTHONPATH: /workspace
      PYTHONIOENCODING: utf-8
      LM_STUDIO_HOST: ${LM_STUDIO_HOST:-llm-gateway}
      LM_STUDIO_PORT: ${LM_STUDIO_PORT:-4000}
      RULER_MODEL: ${RULER_MODEL:-qwen3.6-27b}
      CROWD_MODEL: ${CROWD_MODEL:-qwen2.5-7b-instruct}
      CROWD_FALLBACK_MODEL: ${CROWD_FALLBACK_MODEL:-google/gemma-4-e4b}
      ZUNDA_AI_DIR: /models
    volumes:
      - ..:/workspace
      - ${ZUNDA_AI_HOST:-../models}:/models
    ports:
      - "127.0.0.1:${VIEWER_HOST_PORT:-8765}:8765"
      - "${HTTP_HOST_PORT:-8080}:80"
    # Root Dockerfile ENTRYPOINT runs src.main; keep a long-lived workspace instead.
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
