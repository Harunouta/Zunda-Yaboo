dutch_perry_warning_1852_07:
  yearMonth: "1852-07"
  eventIds: ["dutch_perry_warning"]
  situationKey: dutch_perry_warning
  publicSpeech: |
    アメリカが日本との条約締結を求めており、そのために艦隊を派遣する。中国周辺にあるアメリカ軍艦5隻と、アメリカから派遣される予定の4隻があり、司令官はオーリックからペリーに代わった。艦隊は陸戦用の兵士と兵器を搭載しているとの噂がある。出航は4月下旬以降になろうと言われている。
  sourceUrl: https://ja.wikipedia.org/wiki/%E9%BB%92%E8%88%B9%E6%9D%A5%E8%88%AA
  sourceTitle: 黒船来航
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_spoken_paraphrase
  notes: Spoken/通達口調の言い換え。「オランダによる来航の予告」節の別段風説書記載内容（長崎奉行へ提出・回覧された通報文の要旨）。百科定義ではない。

meiji_restoration_1868_01:
  yearMonth: "1868-01"
  eventIds: ["meiji_restoration"]
  situationKey: meiji_restoration
  publicSpeech: |
    徳川内府宇内之形勢を察し政権を帰し奉り候に付き、朝廷に於て万機御裁決候に付ては、博く天下の公儀をとり偏党の私なきを以て衆心と休戚を同ふし、徳川祖先の制度美事良法は其儘被差置き、御変更これ無くの候間、列藩此聖意を体し、心付候儀は不憚忌諱極言高論して救繩補正に力を尽し、上勤王の実効を顕し下民人の心を失なはず、皇国をして一地球中に冠超せしむる様淬励すべき旨御沙汰候事。
    将軍職辞職を勅許する。京都守護職・京都所司代を廃止する。幕府を廃止する。摂政・関白を廃止する。新たに総裁・議定・参与の三職をおく。
  sourceUrl: https://ja.wikipedia.org/wiki/%E7%8E%8B%E6%94%BF%E5%BE%A9%E5%8F%A4%E3%81%AE%E5%A4%A7%E5%8F%B7%E4%BB%A4
  sourceTitle: 王政復古の大号令
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/布告。朝廷告諭本文＋王政復古の大号令の布告項目（列藩・庶民向けに読み上げ・布告された文言）。

meiji_constitution_1889_02:
  yearMonth: "1889-02"
  eventIds: ["meiji_constitution"]
  situationKey: meiji_constitution
  publicSpeech: |
    朕国家ノ隆昌ト臣民ノ慶福トヲ以テ中心ノ欣栄トシ朕カ祖宗ニ承クルノ大権ニ依リ現在及将来ノ臣民ニ対シ此ノ不磨ノ大典ヲ宣布ス。惟フニ我カ祖我カ宗ハ我カ臣民祖先ノ協力輔翼ニ倚リ我カ帝国ヲ肇造シ以テ無窮ニ垂レタリ。此レ我カ神聖ナル祖宗ノ威徳ト並ニ臣民ノ忠実勇武ニシテ国ヲ愛シ公ニ殉ヒ以テ此ノ光輝アル国史ノ成跡ヲ貽シタルナリ。朕我カ臣民ハ即チ祖宗ノ忠良ナル臣民ノ子孫ナルヲ回想シ其ノ朕カ意ヲ奉体シ朕カ事ヲ奨順シ相与ニ和衷協同シ益々我カ帝国ノ光栄ヲ中外ニ宣揚シ祖宗ノ遺業ヲ永久ニ鞏固ナラシムルノ希望ヲ同クシ此ノ負担ヲ分ツニ堪フルコトヲ疑ハサルナリ。
    朕祖宗ノ遺烈ヲ承ケ万世一系ノ帝位ヲ践ミ朕カ親愛スル所ノ臣民ハ即チ朕カ祖宗ノ恵撫慈養シタマヒシ所ノ臣民ナルヲ念ヒ其ノ康福ヲ増進シ其ノ懿徳良能ヲ発達セシメムコトヲ願ヒ又其ノ翼賛ニ依リ与ニ倶ニ国家ノ進運ヲ扶持セムコトヲ望ミ乃チ明治十四年十月十二日ノ詔命ヲ履践シ茲ニ大憲ヲ制定シ朕カ率由スル所ヲ示シ朕カ後嗣及臣民及臣民ノ子孫タル者ヲシテ永遠ニ循行スル所ヲ知ラシム。朕ハ我カ臣民ノ権利及財産ノ安全ヲ貴重シ及之ヲ保護シ此ノ憲法及法律ノ範囲内ニ於テ其ノ享有ヲ完全ナラシムヘキコトヲ宣言ス。
  sourceUrl: https://ja.wikipedia.org/wiki/%E5%A4%A7%E6%97%A5%E6%9C%AC%E5%B8%9D%E5%9B%BD%E6%86%B2%E6%B3%95
  sourceTitle: 大日本帝国憲法
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/rescript。発布式で渙発された憲法発布勅語＋上諭（三誥）の読み上げ・公布文。

sino_japanese_war_declaration_1894_08:
  yearMonth: "1894-08"
  eventIds: ["sino_japanese_war_dec", "sino_japanese_war_starts", "sino_japanese_war"]
  situationKey: sino_japanese_war_declaration
  publicSpeech: |
    天佑ヲ保全シ万世一系ノ皇祚ヲ践メル大日本帝国皇帝ハ忠実勇武ナル汝有衆ニ示ス。朕茲ニ清国ニ対シテ戦ヲ宣ス。朕カ百僚有司ハ宜ク朕カ意ヲ体シ陸上ニ海面ニ清国ニ対シテ交戦ノ事ニ従ヒ以テ国家ノ目的ヲ達スルニ努力スヘシ。苟モ国際法ニ戻ラサル限リ各々権能ニ応シテ一切ノ手段ヲ尽スニ於テ必ス遺漏ナカラムコトヲ期セヨ。
    朝鮮ハ帝国カ其ノ始ニ啓誘シテ列国ノ伍伴ニ就カシメタル独立ノ一国タリ。而シテ清国ハ毎ニ自ラ朝鮮ヲ以テ属邦ト称シ陰ニ陽ニ其ノ内政ニ干渉シ其ノ内乱アルニ於テ口ヲ属邦ノ拯難ニ籍キ兵ヲ朝鮮ニ出シタリ。
    事既ニ茲ニ至ル。朕平和ト相終始シテ以テ帝国ノ光栄ヲ中外ニ宣揚スルニ専ナリト雖亦公ニ戦ヲ宣セサルヲ得サルナリ。汝有衆ノ忠実勇武ニ倚頼シ速ニ平和ヲ永遠ニ克復シ以テ帝国ノ光栄ヲ全クセムコトヲ期ス。
  sourceUrl: https://ja.wikipedia.org/wiki/%E6%97%A5%E6%B8%85%E6%88%A6%E4%BA%89
  sourceTitle: 日清戦争
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/rescript。『清国ニ対スル宣戦ノ詔勅』の読み上げ文（冒頭＋中盤＋結語）。官報公知の詔書。

russo_japanese_war_declaration_1904_02:
  yearMonth: "1904-02"
  eventIds: ["russo_japanese_war_dec", "russo_japanese_war_starts", "russo_japanese_war"]
  situationKey: russo_japanese_war_declaration
  publicSpeech: |
    天佑ヲ保有シ万世一系ノ皇祚ヲ践メル大日本帝国皇帝ハ忠実勇武ナル汝有衆ニ示ス。朕茲ニ露国ニ対シテ戦ヲ宣ス。朕カ陸海軍ハ宜ク全力ヲ極メテ露国ト交戦ノ事ニ従フヘク朕カ百僚有司ハ宜ク各々其ノ職務ニ率ヒ其ノ権能ニ応シテ国家ノ目的ヲ達スルニ努力スヘシ。凡ソ国際条規ノ範囲ニ於テ一切ノ手段ヲ尽シ遺算ナカラムコトヲ期セヨ。
    帝国ノ重ヲ韓国ノ保全ニ置クヤ一日ノ故ニ非ス。是レ両国累世ノ関係ニ因ルノミナラス韓国ノ存亡ハ実ニ帝国安危ノ繋ル所タレハナリ。然ルニ露国ハ其ノ清国トノ明約及列国ニ対スル累次ノ宣言ニ拘ハラス依然満洲ニ占拠シ益々其ノ地歩ヲ鞏固ニシテ終ニ之ヲ併呑セムトス。
    事既ニ茲ニ至ル。帝国カ平和ノ交渉ニ依リ求メムトシタル将来ノ保障ハ今日之ヲ旗鼓ノ間ニ求ムルノ外ナシ。朕ハ汝有衆ノ忠実勇武ナルニ倚頼シ速ニ平和ヲ永遠ニ克復シ以テ帝国ノ光栄ヲ保全セムコトヲ期ス。
  sourceUrl: https://ja.wikipedia.org/wiki/%E6%97%A5%E9%9C%B2%E6%88%A6%E4%BA%89
  sourceTitle: 日露戦争
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/rescript。『露国ニ対スル宣戦ノ詔勅』の読み上げ文（冒頭＋中盤＋結語）。官報公知の詔書。

great_kanto_cabinet_edict_1923_09:
  yearMonth: "1923-09"
  eventIds: ["great_kanto_earthquake"]
  situationKey: great_kanto_cabinet_edict
  publicSpeech: |
    内閣告諭第二号。今次ノ震災ニ乗シ一部不逞鮮人ノ妄動アリトシテ鮮人ニ対シ頗フル不快ノ感ヲ抱ク者アリト聞ク。鮮人ノ所為若シ不穏ニ亘ルニ於テハ速ニ取締ノ軍隊又ハ警察官ニ通告シテ其ノ処置ニ俟ツヘキモノナルニ、民衆自ラ濫ニ鮮人ニ迫害ヲ加フルカ如キコトハ固ヨリ日鮮同化ノ根本主義ニ背戻スルノミナラス又諸外国ニ報セラレテ決シテ好マシキコトニ非ス。事ハ今次ノ唐突ニシテ困難ナル事態ニ際会シタルニ基因スト認メラルルモ、刻下ノ非常時ニ当リ克ク平素ノ冷静ヲ失ハス慎重前後ノ措置ヲ誤ラス以テ我国民ノ節制ト平和ノ精神トヲ発揮セムコトハ本大臣ノ此際特ニ望ム所ニシテ民衆各自ノ切ニ自重ヲ求ムル次第ナリ。大正十二年九月五日 内閣総理大臣。
  sourceUrl: https://ja.wikipedia.org/wiki/%E9%96%A2%E6%9D%B1%E5%A4%A7%E9%9C%87%E7%81%BD
  sourceTitle: 関東大震災
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/告諭。内閣告諭第二号本文（民衆向けに発せられた政府告諭の読み上げ文）。

national_mobilization_1938_04:
  yearMonth: "1938-04"
  eventIds: ["national_mobilization_law"]
  situationKey: national_mobilization_law
  publicSpeech: |
    近代国家ノ特質ニ鑑ミ国家総動員ノ実施及準備ニ付準拠スベキ法規ヲ制定シ現下時局ノ推移及将来ノ戦時事変ニ備フルノ要アリ。
    帝国政府ハ南京攻略後尚ホ支那国民政府ノ反省ニ最後ノ機会ヲ与フルタメ今日ニ及ヘリ。然ルニ国民政府ハ帝国ノ真意ヲ解セス漫リニ抗戦ヲ策シ内民人塗炭ノ苦ミヲ察セス外東亜全局ノ和平ヲ顧ルトコロナシ。仍テ帝国政府ハ爾後国民政府ヲ対手トセス、帝国ト真ニ提携スルニ足ル新興支那政権ノ成立発展ヲ期待シ是ト両国国交ヲ調整シ更生新支那ノ建設ニ協力セントス。元ヨリ帝国カ支那ノ領土及主権並ニ在支列国ノ権益ヲ尊重スルノ方針ニハ毫モカハル所ナシ。今ヤ東亜和平ニ対スル帝国ノ責任愈々重シ。政府ハ国民ガ此ノ重大ナル任務遂行ノタメ一層ノ発奮ヲ冀望シテ止マス。
  sourceUrl: https://ja.wikipedia.org/wiki/%E5%9B%BD%E5%AE%B6%E7%B7%8F%E5%8B%95%E5%93%A1%E6%B3%95
  sourceTitle: 国家総動員法
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/議会説明＋政府声明。衆議院提案理由説明の文言と第一次近衛声明（国民向け政府声明）の本文。

pearl_harbor_1941_12:
  yearMonth: "1941-12"
  eventIds: ["pearl_harbor_attack", "pacific_war_start", "pacific_war"]
  situationKey: pearl_harbor_war_declaration
  publicSpeech: |
    天佑を保有し万世一系の皇祚を践める大日本帝国天皇は昭に忠誠勇武なる汝有衆に示す。朕茲に米国及英国に対して戦を宣す。朕が陸海将兵は全力を奮いて交戦に従事し朕が百僚有司は励精職務を奉行し朕が衆庶は各々其の本分を尽し億兆一心国家の総力を挙げて征戦の目的を達成するに遺算なからんことを期せよ。
    抑々東亜の安定を確保し以て世界の平和に寄与するは丕顕なる皇祖考丕承なる皇考の作述せる遠猷にして朕が拳々措かざる所。而して列国との交誼を篤くし万邦共栄の楽を偕にするは之亦帝国が常に国交の要義と為す所なり。今や不幸にして米英両国と釁端を開くに至る。洵に已むを得ざるものあり豈朕が志ならんや。
    事既に此に至る帝国は今や自存自衛の為蹶然起って一切の障礙を破砕するの外なきなり。皇祖皇宗の神霊上に在り。朕は汝有衆の忠誠勇武に信倚し祖宗の遺業を恢弘し速に禍根を芟除して東亜永遠の平和を確立し以て帝国の光栄を保全せんことを期す。
  sourceUrl: https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E3%81%AE%E5%AF%BE%E7%B1%B3%E8%8B%B1%E5%AE%A3%E6%88%A6%E5%B8%83%E5%91%8A
  sourceTitle: 日本の対米英宣戦布告
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/rescript。米英両国ニ対スル宣戦ノ詔書の読み上げ文（大詔奉戴・常用漢字改編版の冒頭＋結語）。

war_end_jewel_voice_1945_08:
  yearMonth: "1945-08"
  eventIds: ["war_end", "postwar_pol_194508_4", "postwar_pol_194508_5"]
  situationKey: jewel_voice
  publicSpeech: |
    朕深く世界の大勢と帝国の現状とに鑑み非常の措置をもって時局を収拾せんと欲しここに忠良なる汝臣民に告ぐ。朕は帝国政府をして米英支蘇四国に対しその共同宣言を受諾する旨通告せしめたり。そもそも帝国臣民の康寧をはかり万邦共栄の楽しみを共にするは皇祖皇宗の遺範にして朕の拳々措かざる所。さきに米英二国に宣戦せる所以もまた実に帝国の自存と東亜の安定とを庶幾するに出でて他国の主権を排し領土を侵すが如きはもとより朕が志にあらず。然るに交戦既に四歳を閲し朕が陸海将兵の勇戦朕が百僚有司の励精朕が一億衆庶の奉公各々最善を尽くせるに拘らず戦局必ずしも好転せず世界の大勢また我に利あらず。しかのみならず敵は新たに残虐なる爆弾を使用してしきりに無辜を殺傷し惨害の及ぶところ真に測るべからざるに至る。しかもなお交戦を継続せんか遂に我が民族の滅亡を招来するのみならずひいて人類の文明をも破却すべし。かくの如くは朕何をもってか億兆の赤子を保し皇祖皇宗の神霊に謝せんや。是れ朕が帝国政府をして共同宣言に応せしむるに至れる所以なり。思うに今後帝国の受くべき苦難はもとより尋常にあらず汝臣民の衷情も朕よく是れを知る。然れども朕は時運の赴く所堪え難きを堪え忍び難きを忍びもって万世の為に太平を開かんと欲す。汝臣民それ克く朕が意を体せよ。
  sourceUrl: https://ja.wikipedia.org/wiki/%E7%8E%89%E9%9F%B3%E6%94%BE%E9%80%81
  sourceTitle: 玉音放送
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/broadcast/rescript。玉音放送で読み上げられた終戦の詔書（「詔書全文」節の読み下し）。

humanity_declaration_1946_01:
  yearMonth: "1946-01"
  eventIds: ["postwar_pol_194601_7"]
  situationKey: humanity_declaration
  publicSpeech: |
    朕ト爾等国民トノ間ノ紐帯ハ、終始相互ノ信頼ト敬愛トニ依リテ結バレ、単ナル神話ト伝説トニ依リテ生ゼルモノニ非ズ。天皇ヲ以テ現御神トシ、且日本国民ヲ以テ他ノ民族ニ優越セル民族ニシテ、延テ世界ヲ支配スベキ運命ヲ有ストノ架空ナル観念ニ基クモノニモ非ズ。
