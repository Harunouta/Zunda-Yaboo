oil_shock_1979_02:
  yearMonth: "1979-02"
  eventIds: ["postwar_evt_197902_40"]
  situationKey: oil_shock_1979
  publicSpeech: |
    国民にエネルギー節約を呼びかける。
    官庁暖房の停止、夏のノーネクタイ、マイカー自粛など、石油消費5パーセント節約の実施策を定める。
    この法律は、燃料資源の大部分を輸入に依存せざるを得ない我が国のエネルギー事情にかんがみ、燃料資源の有効な利用の確保に資するため、工場、建築物及び機械器具についてエネルギーの使用の合理化に関する所要の措置等を講ずることとし、もつて国民経済の健全な発展に寄与することを目的とする。
  sourceUrl: https://www.esri.cao.go.jp/jp/esri/prj/sbubble/history/history_02/analysis_02_chronology_01.pdf
  sourceTitle: バブル／デフレ期の日本経済と経済政策（年表）／エネルギーの使用の合理化に関する法律
  license: government_speech_archive
  retrievedDate: "2026-09-21"
  evidence: wikipedia_spoken_paraphrase
  notes: 1979-02-17通産省「国民にエネルギー節約を呼びかける方針」＋省エネルギー・省資源対策推進会議の石油消費5%節約実施策（内閣府ESRI年表）の言い換え。省エネ法（昭和54年法律第49号）第1条は同年6月公布の目的条文。首相会見逐語録ではない。
