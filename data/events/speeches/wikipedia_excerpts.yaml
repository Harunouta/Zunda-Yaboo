    紙などの節約を呼び掛ける。
    この法律は、我が国への石油の大幅な供給不足が生ずる場合及び我が国における災害の発生により国内の石油の大幅な供給不足が生ずる場合において、国民生活の安定と国民経済の円滑な運営を図るため、石油の適正な供給を確保し、及び石油の使用を節減するための措置を講ずることにより、石油の需給を適正化することを目的とする。
    この法律は、物価の高騰その他の我が国経済の異常な事態に対処するため、国民生活との関連性が高い物資及び国民経済上重要な物資の価格及び需給の調整等に関する緊急措置を定め、もつて国民生活の安定と国民経済の円滑な運営を確保することを目的とする。
  sourceUrl: https://laws.e-gov.go.jp/law/348AC0000000122
  sourceTitle: 石油需給適正化法／国民生活安定緊急措置法（e-Gov）・トイレットペーパー騒動／噂（WP）
  license: government_speech_archive
  retrievedDate: "2026-09-21"
  evidence: wikipedia_spoken_paraphrase
  notes: Spoken/law purpose + minister call。中曽根通産相の「紙節約の呼びかけ」（WP「トイレットペーパー騒動」「噂」記載の公表呼びかけの言い換え）＋石油需給適正化法・国民生活安定緊急措置法各第1条（目的）。会見連続文ではない。

consumption_tax_3_1989_04:
  yearMonth: "1989-04"
  eventIds: ["consumption_tax_3"]
  situationKey: consumption_tax_3
  publicSpeech: |
    この法律は、昭和六十三年六月十五日に行われた税制調査会の答申の趣旨にのつとつて行われる税制の抜本的な改革の趣旨、基本理念及び方針を明らかにし、かつ、簡潔にその全体像を示すことにより、今次の税制改革についての国民の理解を深めるとともに、今次の税制改革が、整合性をもつて、包括的かつ一体的に行われることに資するほか、今次の税制改革が我が国の経済社会に及ぼす影響にかんがみ、国等の配慮すべき事項について定めることを目的とする。
    今次の税制改革は、所得課税において税負担の公平の確保を図るための措置を講ずるとともに、税体系全体として税負担の公平に資するため、所得課税を軽減し、消費に広く薄く負担を求め、資産に対する負担を適正化すること等により、国民が公平感をもつて納税し得る税体系の構築を目指して行われるものとする。
    消費に広く薄く負担を求める消費税を創設する。その税率は、百分の三とする。
  sourceUrl: https://laws.e-gov.go.jp/law/363AC0000000107
  sourceTitle: 税制改革法（e-Gov）
  license: government_speech_archive
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/statute announced wording。税制改革法第1条（目的）・第4条（方針：所得課税軽減・消費に広く薄く・資産負担適正化）・第10条（消費税創設・税率百分の三）。首相会見全文ではないが、公布・周知された改革の公的文言。

