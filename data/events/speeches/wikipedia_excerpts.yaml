tokyo_olympics_1964_10:
  yearMonth: "1964-10"
  eventIds: ["tokyo_olympics", "olympics_pol_196410_2"]
  situationKey: tokyo_olympics_opening
  publicSpeech: |
    待望久しい第18回オリンピック競技大会が本日より15日間にわたり、開催されることになりましたことは誠に喜ばしい限りであります。オリンピック東京大会はアジアで開催される初めての大会でありますが、幸いこれまでにない多数の選手団の参加をみましたことは誠にご同慶にたえない次第であります。願わくはオリンピック精神に則り、正々堂々たる競技が展開されることを期待してやみません。
    第18回近代オリンピアードを祝い、ここにオリンピック東京大会の開会を宣言します。
    宣誓。私は全ての競技者の名に於いて、オリンピック競技大会の規約を尊重し、スポーツの栄光とチームの名誉のため、真のスポーツマン精神を持って、大会に参加することを誓います。選手代表 小野喬。
  sourceUrl: https://ja.wikipedia.org/wiki/1964%E5%B9%B4%E6%9D%B1%E4%BA%AC%E3%82%AA%E3%83%AA%E3%83%B3%E3%83%94%E3%83%83%E3%82%AF%E3%81%AE%E9%96%8B%E4%BC%9A%E5%BC%8F
  sourceTitle: 1964年東京オリンピックの開会式
  license: CC-BY-SA-4.0
  retrievedDate: "2026-09-21"
  evidence: wikipedia_excerpt
  notes: Spoken/ceremony。開会式での安川組織委会長挨拶・昭和天皇開会宣言・選手宣誓（会場・ラジオで公衆に読み上げられた文言）。

nixon_shock_1971_08:
  yearMonth: "1971-08"
  eventIds: ["nixon_shock"]
  situationKey: nixon_shock
  publicSpeech: |
    ……過去7年間、毎年1回は通貨危機が起きている。通貨危機で一体誰が利益を得たのか。労働者でも、投資家でも、富の真の生産者でもない。受益者は国際通貨の投機家です。彼らは危機で栄える故に危機を起こそうとしています。……
