# World-scoped shocks that can reach Japan's node (trade, metals, sugar, oil, rumor).
# Sparse by design — NOT a full world history timeline. See ../README.md
# Japan domestic history: user edits japan/* ; keep overlap intentional only when useful.

# --- 17c: silver / East Asian order / VOC ---
potosi_silver_wave:
  scope: world
  promptForLeader: 新大陸ポトシ銀がアジア市へ流れ、銀建ての交易条件が揺れているとの遠報。国内の銀・藩札の扱いを見直せ。
  promptForOpinionLeader: 南蛮の銀が安い、と長崎で囁く行商がいる。
  worldEffect: gold_outflow
  notes: 17c Asian silver glut proxy (sparse)

manchu_beijing_fall:
  scope: world
  promptForLeader: 明が倒れ清が北京を押さえたとの大陸報。東アジア秩序の転換をどう読む？
  promptForOpinionLeader: 唐土の王が変わった、と唐人・オランダ情報が飛ぶ。

zheng_taiwan_expulsion:
  scope: world
  promptForLeader: 台湾からオランダが追い出されたとの報。南洋航路と砂糖・鹿皮交易が乱れる恐れ。
  promptForOpinionLeader: 台湾の港が静かになった、と舟乗りが噂する。
  worldEffect: sugar_spike

treaty_nerchinsk:
  scope: world
  promptForLeader: 清とロシアがネルチンスクで境界を定めたとの報。北方交易と鉄砲・毛皮の噂が動く。
  promptForOpinionLeader: 北の異国が唐土と手を結んだ、と恐れる者もいる。

thirty_years_war_peak:
  scope: world
  promptForLeader: 欧州の三十年戦争が長期化し、傭兵と物資が大西洋交易を圧迫しているとの報。
  promptForOpinionLeader: 遠国で戦争が終わらない、船が少ない、と港で聞く。
  worldEffect: sugar_spike

tulip_mania_burst:
  scope: world
  promptForLeader: オランダでチューリップ投機が破裂したとの奇報。信用と為替の噂が東インド会社経由で届く。
  promptForOpinionLeader: 花の球根で破産した国がある、と笑う噂。

anglo_dutch_war:
  scope: world
  promptForLeader: 英蘭戦争で北海・アジア航路が戦場化。オランダ経由の長崎物資が滞る恐れ。
  promptForOpinionLeader: 紅毛の船が遅れる、戦争だ、と噂。
  worldEffect: sugar_spike

franco_dutch_war:
  scope: world
  promptForLeader: 仏蘭戦争でオランダ本国が圧迫され、VOC航路と為替が揺れている。
  promptForOpinionLeader: オランダが攻められている、唐船も減る、と不安が広がる。
  worldEffect: sugar_spike

spanish_succession_war:
  scope: world
  promptForLeader: スペイン継承戦争で欧州と植民地の覇権が揺れている。銀と砂糖の流れに注意せよ。
  promptForOpinionLeader: 王の跡目争いで海が荒れる、と南蛮話。
  worldEffect: gold_outflow

treaty_utrecht:
  scope: world
  promptForLeader: ユトレヒト条約で継承戦争が収束。植民地と奴隷・砂糖交易の枠組みが変わるとの報。
  promptForOpinionLeader: 戦争が終わった、南蛮の地図がまた変わった、と噂。
  worldEffect: sugar_spike

american_independence:
  scope: world
  promptForLeader: 英領アメリカが独立を宣言したとの報。大西洋交易と将来の太平洋進出の種を読め。
  promptForOpinionLeader: 新しい国が生まれた、イギリスが負けた、と驚く。

spanish_american_war:
  scope: world
  promptForLeader: 米西戦争でフィリピンが戦場・占領へ。東アジアの米軍プレゼンスが急変する。
  promptForOpinionLeader: アメリカが南の島を取った、次は日本か、と怯える者も。
  worldEffect: gold_outflow

vietnam_escalation:
  scope: world
  promptForLeader: ベトナム戦争が拡大し、アジアの軍事需要とドル・資源が動いている。特需とインフレの両面を見よ。
  promptForOpinionLeader: 南の戦争で仕事が増える、若者は恐れる、と噂が割れる。
  worldEffect: oil_spike

nixon_shock:
  scope: world
  promptForLeader: ニクソン・ショックでドルと金の兌換が停止。ブレトンウッズ後の為替が宙に浮く。
  promptForOpinionLeader: ドルの約束が壊れた、お金の意味が分からない、と騒ぐ。
  worldEffect: gold_outflow

# --- 18c: Atlantic finance / sugar / war ---
