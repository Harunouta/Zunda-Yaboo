  scope: japan
  promptForLeader: 大坂で一揆・騒動が起きた。弾圧か施しか。
  promptForOpinionLeader: 米屋を襲う噂。怒りが燃え広がる。
perry_arrival:
  scope: japan
  promptForLeader: 1853年7月。未知の黒船が来航し、開国と交易を要求している。徹底抗戦か、輸出か、砂糖・技術交渉か。
