services:
  zunda-yaboo:
    build: .
    container_name: zunda-yaboo-run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LM_STUDIO_HOST: ${LM_STUDIO_HOST:-host.docker.internal}
      LM_STUDIO_PORT: ${LM_STUDIO_PORT:-1234}
      RULER_MODEL: ${RULER_MODEL:-qwen3.6-27b}
      CROWD_MODEL: ${CROWD_MODEL:-google/gemma-4-e4b}
      ZUNDA_AI_DIR: /models
    volumes:
      - ./logs:/workspace/logs
      - ./checkpoints:/workspace/checkpoints
      - ${ZUNDA_AI_HOST:-D:/Zunda-AI}:/models
    ports:
      - "8080:80"
    command:
      - --standard
      - ${STANDARD:-zunda}
      - --start
      - ${START:-1603-01}
      - --end
      - ${END:-2026-08}
